name: Publish scheduled content

# Pages are written ahead of time and sit in answers/ unlisted. This registers
# whichever ones are due today in sitemap.xml, answers/index.html and llms.txt,
# which is what actually makes them discoverable.
#
# Runs daily and exits quietly when nothing is due, so it is safe to leave on.

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch:       # and a manual button, for catching up or testing
    inputs:
      day:
        description: "Publish a specific scheduled day (blank = whatever is due today)"
        required: false
      dry_run:
        description: "Report what would change without committing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish what is due
        id: publish
        run: |
          ARGS=""
          [ -n "${{ inputs.day }}" ] && ARGS="$ARGS --day ${{ inputs.day }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python3 tools/publish.py $ARGS | tee /tmp/out.txt
          echo "summary=$(tail -1 /tmp/out.txt)" >> "$GITHUB_OUTPUT"

      - name: Check nothing malformed
        if: ${{ inputs.dry_run != true }}
        run: |
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"
          # An em dash violates house style and also trips Reddit's spam filters.
          # The character is built from its code point so this file does not
          # contain one itself, which would make the check fail on the workflow.
          DASH=$(printf '\u2014')
          if grep -rl "$DASH" --include='*.html' --include='*.txt' --include='*.xml' . | grep -v node_modules; then
            echo "em dash found, refusing to publish"; exit 1
          fi

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet; then
            echo "no changes, nothing to commit"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml answers/index.html llms.txt
          git commit -m "Publish scheduled content

          ${{ steps.publish.outputs.summary }}

          Pages were written ahead of time and sat in answers/ unlisted. This
          registers the ones due today in the sitemap, the answers index and
          llms.txt, which is what makes them discoverable."
          git push
